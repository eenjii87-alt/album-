<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Миний гэр бүлүүд · Гэр бүлийн цомог</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1d1322;--bg2:#2a1d30;--bg3:#37273e;--ink:#fbeee0;--mute:#c4a9b8;--line:#4a3550;--acc:#ffb45e}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 'Nunito',system-ui,sans-serif;background:radial-gradient(55% 40% at 88% -6%,rgba(255,170,90,.3),transparent 70%),radial-gradient(45% 35% at -4% 104%,rgba(255,110,170,.18),transparent 70%),var(--bg);background-attachment:fixed}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding:clamp(20px,4vw,44px) max(4vw,16px) 60px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:24px}
h1{font:700 clamp(40px,6vw,56px)/1 'Caveat',cursive;margin:0}
.hi{color:var(--mute);margin:6px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:800 15px 'Nunito',system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.pri{border:0;background:linear-gradient(135deg,#ffc36e,#ff9a7a);color:#2a1420}
.btn:disabled{opacity:.5}
:is(.btn,input):focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.list{display:grid;gap:12px;margin-bottom:28px}
.sp{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px}
.cv{width:54px;height:66px;border-radius:6px;background:linear-gradient(160deg,#9a6a9c,#7b4b7f 55%,#5e3862);box-shadow:0 8px 16px -6px rgba(0,0,0,.6);display:grid;place-items:center;font:700 26px/1 'Caveat',cursive}
.sp h2{font:800 18px/1.25 'Nunito',system-ui,sans-serif;margin:0 0 2px}
.sp p{margin:0;color:var(--mute);font-size:14px}
.go{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,26px)}
.card h2{font:700 32px/1.1 'Caveat',cursive;margin:0 0 6px}
.card p{color:var(--mute);margin:0 0 16px}
label{display:grid;gap:6px;font-weight:700;font-size:14px;color:var(--mute);margin-bottom:12px}
input{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:16px 'Nunito',system-ui,sans-serif}
.msg{min-height:22px;margin:10px 0 0;font-weight:700;color:#ffb2a6}
.empty{background:rgba(255,180,94,.08);border:1.5px dashed rgba(255,180,94,.5);border-radius:18px;padding:18px;color:#ead8cb;margin-bottom:20px}
.foot{margin-top:26px;color:var(--mute);font-size:14px;display:flex;gap:16px;flex-wrap:wrap}
.foot a{color:var(--mute)}
@media(max-width:560px){.sp{grid-template-columns:auto 1fr}.go{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Миний гэр бүлүүд</h1><p class="hi" id="hi"></p></div>
    <button class="btn" id="out" type="button">Гарах</button>
  </header>
  <div id="empty" class="empty" hidden>Тавтай морил! Эхлээд гэр бүлийнхээ цомгийг доороос үүсгээрэй. Хэн нэгэн таныг урьсан бол тэр гэр бүл энд автоматаар гарч ирнэ.</div>
  <div class="list" id="list"></div>
  <form class="card" id="newF">
    <h2>Шинэ гэр бүлийн цомог</h2>
    <p>Энэ нь таны гэр бүлийн тусдаа орон зай болно. Дараа нь аав ээж, ажлынхнаа урина.</p>
    <label>Гэр бүлийн нэр<input id="sName" maxlength="60" required placeholder="Жишээ нь: Батынхан, Манай гэр бүл"></label>
    <label>Таны нэр (бусдад харагдана)<input id="mName" maxlength="40" required placeholder="Жишээ нь: Сараа"></label>
    <button class="btn pri" type="submit" id="mk">Үүсгэх</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
  <div class="foot"><a href="/terms">Үйлчилгээний нөхцөл, нууцлал</a></div>
</div>
<script>
{
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function load() {
  const r = await fetch('/api/me', { credentials: 'same-origin' });
  if (r.status === 401) { location.href = '/login?next=/home'; return; }
  const me = await r.json();
  $('hi').textContent = `${me.name} · ${me.email}`;
  if (!$('mName').value) $('mName').value = me.name;
  $('empty').hidden = me.spaces.length > 0;
  $('list').innerHTML = me.spaces.map(s => `<div class="sp"><div class="cv">${esc((s.name || '?').trim().charAt(0).toUpperCase())}</div><div><h2>${esc(s.name)}</h2><p>${s.owner ? 'Та эзэн нь' : s.album && s.share ? 'Гэр бүл · Хамт олон' : s.album ? 'Гэр бүлийн гишүүн' : 'Хамт олон'}</p></div><div class="go">${s.album ? `<a class="btn pri" href="/s/${s.id}/">Цомог</a>` : ''}${s.share ? `<a class="btn" href="/s/${s.id}/share/">Дамжуулах</a>` : ''}${s.owner ? `<a class="btn" href="/s/${s.id}/admin">Удирдлага</a>` : ''}</div></div>`).join('');
}
$('newF').addEventListener('submit', async e => {
  e.preventDefault();
  $('mk').disabled = true; $('msg').textContent = '';
  const r = await fetch('/api/spaces', { method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ name: $('sName').value, myName: $('mName').value }) });
  const j = await r.json().catch(() => ({ error: 'net' }));
  $('mk').disabled = false;
  if (j.error) { $('msg').textContent = j.error === 'too_many' ? 'Нэг хүн 3 хүртэл гэр бүлийн цомог үүсгэнэ.' : 'Үүсгэж чадсангүй, дахин оролдоно уу.'; return; }
  location.href = `/s/${j.id}/admin#drive`;
});
$('out').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); location.href = '/'; });
load();
}
</script>
</body>
</html>
